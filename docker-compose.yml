services:
  clients-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clients
      POSTGRES_USER: ${POSTGRES_USER:-devsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsu_password}
    volumes: [clients-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d clients"]
      interval: 5s
      timeout: 5s
      retries: 10

  accounts-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: ${POSTGRES_USER:-devsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devsu_password}
    volumes: [accounts-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d accounts"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clients-api:
    build:
      context: .
      dockerfile: Dockerfile.clients
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ClientsDatabase: Host=clients-db;Port=5432;Database=clients;Username=${POSTGRES_USER:-devsu};Password=${POSTGRES_PASSWORD:-devsu_password}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    ports: ["8081:8080"]
    depends_on:
      clients-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  accounts-api:
    build:
      context: .
      dockerfile: Dockerfile.accounts
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AccountsDatabase: Host=accounts-db;Port=5432;Database=accounts;Username=${POSTGRES_USER:-devsu};Password=${POSTGRES_PASSWORD:-devsu_password}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    ports: ["8082:8080"]
    depends_on:
      accounts-db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  clients-data:
  accounts-data: